# dsh-web-app bundle patch for DeepSeek Harness.
#
# One host row owns the app registry, the deploy/check tools, the `/webapp`
# command, the stamping static route, and the package-private JSON channel the
# browser half uses. The browser row is discovered from this package's
# `dsh.client` declaration plus its `./client` export.
- insert:
    - id: dsh-web-app
      name: 'dsh-web-app'
